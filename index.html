<title>ISISA Portal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky masthead + tab bar, one section visible at a time, KPI strip first, detail tables below. */
:root{
  --bg:#f2f2f2; --surface:#ffffff; --ink:#0d0d0d; --muted:#5f5f5f; --line:#d9d9d9; --soft:#ececec;
  --accent:#0d0d0d; --accent-ink:#ffffff; --accent-soft:#e2e2e2;
  --warn:#3d3d3d; --warn-soft:#e9e9e9; --bad:#0d0d0d; --bad-soft:#dcdcdc; --good:#3d3d3d; --good-soft:#ececec;
  --y1:#d0d0d0; --y2:#a6a6a6; --y3:#7d7d7d; --y4:#4d4d4d;
  --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0b0b; --surface:#151515; --ink:#f2f2f2; --muted:#9a9a9a; --line:#2a2a2a; --soft:#1d1d1d;
  --accent:#f2f2f2; --accent-ink:#0b0b0b; --accent-soft:#262626;
  --warn:#d0d0d0; --warn-soft:#222222; --bad:#ffffff; --bad-soft:#2e2e2e; --good:#d0d0d0; --good-soft:#222222;
  --y1:#3a3a3a; --y2:#5c5c5c; --y3:#858585; --y4:#b5b5b5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0b0b; --surface:#151515; --ink:#f2f2f2; --muted:#9a9a9a; --line:#2a2a2a; --soft:#1d1d1d;
  --accent:#f2f2f2; --accent-ink:#0b0b0b; --accent-soft:#262626;
  --warn:#d0d0d0; --warn-soft:#222222; --bad:#ffffff; --bad-soft:#2e2e2e; --good:#d0d0d0; --good-soft:#222222;
  --y1:#3a3a3a; --y2:#5c5c5c; --y3:#858585; --y4:#b5b5b5; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.01em}
.mast{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:18px 0 12px}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.lg{width:46px;height:46px;object-fit:contain;border-radius:6px;flex:none}
.sep{width:1px;height:34px;background:var(--line);flex:none}
.brand h1{font-size:19px}
.brand p{margin:0;color:var(--muted);font-size:12.5px}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input[type=search]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 10px;min-height:36px}
select:focus-visible,input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{font:inherit;font-weight:500;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 12px;min-height:36px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.note{background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn);border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:12px}
.note b{color:var(--ink)}
.layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:28px;align-items:start;margin-top:8px}
nav.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
nav.tabs a{color:var(--muted);text-decoration:none;padding:9px 12px;font-weight:500;border-radius:7px;border-left:3px solid transparent}
nav.tabs a:hover{color:var(--ink);background:var(--soft)}
nav.tabs a[aria-current=page]{color:var(--accent);background:var(--accent-soft);border-left-color:var(--accent)}
@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr);gap:0}
  nav.tabs{flex-direction:row;overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;border-radius:0;border:0;border-bottom:1px solid var(--line);background:var(--bg);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-left,0px))}
  nav.tabs a{white-space:nowrap;border-left:0;border-radius:0;border-bottom:2px solid transparent;padding:11px 13px}
  nav.tabs a[aria-current=page]{background:none;border-bottom-color:var(--accent)}
}
main{padding-block:20px 48px}
section[hidden]{display:none!important}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sec-head h2{font-size:21px}
.sec-head .src{font:12px var(--mono);color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font:600 24px/1.2 var(--mono);margin-top:4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:14px;margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.card h3{font-size:14.5px;margin-bottom:2px}
.card .sub{color:var(--muted);font-size:12.5px;margin:0 0 10px}
.tbl{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--soft);vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;white-space:nowrap;border-bottom:1px solid var(--line)}
th.sortable{cursor:pointer}
th.sortable:hover{color:var(--ink)}
td.n,th.n{text-align:right;font-family:var(--mono);font-size:13px;white-space:nowrap}
tr.tot td{font-weight:600;border-top:1px solid var(--line);background:var(--soft)}
tr.sub td{color:var(--muted);font-size:13px}
.pill{display:inline-block;font-size:11.5px;font-weight:500;border-radius:99px;padding:1px 9px;white-space:nowrap}
.pill.pend{background:transparent;color:var(--muted);border:1px dashed var(--muted)}
.pill.ok{background:var(--good-soft);color:var(--ink)}
.pill.bad{background:var(--ink);color:var(--bg)}
.na{color:var(--muted);font:italic 12px var(--font);white-space:normal}
td.n .na{font-family:var(--font)}
.kum{background:var(--y1);height:100%;display:flex}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:10px;align-items:center;font-size:13px}
.bar .t{min-width:0;overflow-wrap:anywhere}
.bar .tr{height:14px;background:var(--soft);border-radius:3px;overflow:hidden;display:flex}
.bar .fl{background:var(--accent);height:100%}
.bar .fl.b{background:var(--y3)}
.bar .v{font:13px var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.stack{display:flex;height:22px;border-radius:4px;overflow:hidden;margin:6px 0 10px;background:var(--soft)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
svg text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
svg .grid line{stroke:var(--line)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:5px 12px;border-radius:99px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.toolbar .grow{flex:1;min-width:160px}
.toolbar input{width:100%}
.muted{color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.mini{background:var(--soft);border-radius:8px;padding:9px 11px}
.mini b{display:block;font:600 18px var(--mono)}
.mini span{font-size:12px;color:var(--muted)}
ul.clean{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--soft)}
.chk:last-child{border-bottom:0}
.chk .pill{flex:none;margin-top:1px}
.chk p{margin:0}
.chk .d{color:var(--muted);font-size:13px}
footer{color:var(--muted);font-size:12.5px;padding:14px 0 28px;border-top:1px solid var(--line)}
.tog{display:flex;gap:8px;align-items:center;font-size:13px}
@media (max-width:560px){.bar{grid-template-columns:1fr auto}.bar .tr{grid-column:1/-1;order:3}.sec-head h2{font-size:18px}}
@media (prefers-reduced-motion:no-preference){.fl{transition:width .4s}}
</style>

/* ---------- helpers ---------- */
const sum = (a, i) => a.reduce((s,r)=>s+(r[i]||0),0);
const th = (cols) => '<tr>'+cols.map(c=>`<th class="${c.n?'n':''}">${c.t}</th>`).join('')+'</tr>';
function table(cols, rows, opts={}){
  const body = rows.map(r=>`<tr class="${r._cls||''}">`+r.cells.map((c,i)=>`<td class="${cols[i].n?'n':''}">${c}</td>`).join('')+'</tr>').join('');
  return `<div class="tbl"><table><thead>${th(cols)}</thead><tbody>${body}</tbody></table></div>`;
}
function bars(items, o={}){
  const max = Math.max(...items.map(i=>i.v), 1e-9);
  return '<div class="bars">'+items.map(i=>`<div class="bar"><div class="t">${esc(i.l)}</div><div class="tr"><div class="fl ${i.b?'b':''}" style="width:${Math.max(i.v/max*100,i.v>0?1.5:0)}%"></div></div><div class="v">${o.f?o.f(i.v):fmt(i.v)}</div></div>`).join('')+'</div>';
}
function cumBars(items,f=int){const rows=items.filter(i=>i.b);const max=Math.max(...rows.map(i=>i.b),1e-9);return '<div class="bars">'+rows.map(i=>`<div class="bar"><div class="t">${esc(i.l)}</div><div class="tr"><div class="kum" style="width:${i.b/max*100}%"><div class="fl" style="width:${i.a/i.b*100}%"></div></div></div><div class="v">${f(i.a)} / ${f(i.b)}</div></div>`).join('')+'</div><div class="legend" style="margin-top:10px"><span><i style="background:var(--accent)"></i>September</span><span><i style="background:var(--y1)"></i>Kumulatif</span></div>';}
const f2=v=>v>=100?fmt(v,0):fmt(v,2), fRM=v=>'RM '+int(Math.round(v));
function kpis(list){return '<div class="kpis">'+list.map(k=>`<div class="kpi"><div class="l">${k[0]}</div><div class="v">${k[1]}</div><div class="s">${k[2]||''}</div></div>`).join('')+'</div>';}
function card(title, sub, html){return `<div class="card"><h3>${title}</h3>${sub?`<p class="sub">${sub}</p>`:''}${html}</div>`;}
function head(t, src){return `<div class="sec-head"><h2>${t}</h2><span class="src">${src||''}</span></div>`;}
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v)));const m=v/p;return (m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*p;}
function lineChart(series, o={}){
  const W=640,H=250,L=58,Rr=14,T=12,B=26;
  const all=series.flatMap(s=>s.vals.filter(v=>v!=null));
  const lo=o.zero?0:Math.floor(Math.min(...all)/ (o.step||1000))*(o.step||1000)*0.0+Math.min(...all)*0.9, hi=niceMax(Math.max(...all)*1.04);
  const y0=o.zero?0:Math.floor(lo/(hi/5))*(hi/5);
  const X=i=>L+i*(W-L-Rr)/11, Y=v=>T+(1-(v-y0)/(hi-y0))*(H-T-B);
  let g='';
  for(let k=0;k<=4;k++){const v=y0+(hi-y0)*k/4,y=Y(v);g+=`<line x1="${L}" x2="${W-Rr}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${o.axis?o.axis(v):int(Math.round(v))}</text>`;}
  let xs=MONTHS.map((m,i)=>`<text x="${X(i)}" y="${H-8}" text-anchor="middle">${m}</text>`).join('');
  let ln='';
  series.forEach(s=>{
    const pts=s.vals.map((v,i)=>v==null?null:[X(i),Y(v)]);
    const d=pts.map((p,i)=>p?(i&&pts[i-1]?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1):'').join(' ');
    ln+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="${s.w||1.6}" stroke-linejoin="round" stroke-linecap="round"/>`;
    if(s.end){const i=s.vals.map(v=>v!=null).lastIndexOf(true);const p=pts[i];ln+=`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${s.c}"/><text x="${p[0]}" y="${p[1]-9}" text-anchor="middle" style="fill:var(--ink)">${o.axis?o.axis(s.vals[i]):int(Math.round(s.vals[i]))}</text>`;}
  });
  const leg='<div class="legend">'+series.map(s=>`<span><i style="background:${s.c}"></i>${s.n}</span>`).join('')+'</div>';
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${o.label||'Graf'}"><g class="grid">${g}</g>${xs}${ln}</svg>${leg}`;
}
const YC={2022:'var(--y1)',2023:'var(--y2)',2024:'var(--y3)',2025:'var(--y4)',2026:'var(--accent)'};
function yearSeries(obj, years){return years.map(y=>({n:y,vals:obj[y],c:YC[y],w:y==2026?2.8:1.5,end:y==2026}));}
function csvCopy(btn, rows){
  const csv=rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\n');
  btn.onclick=async()=>{try{await navigator.clipboard.writeText(csv);btn.textContent='CSV disalin';}catch(e){const t=document.createElement('textarea');t.value=csv;document.body.appendChild(t);t.select();try{document.execCommand('copy');btn.textContent='CSV disalin';}catch(_){btn.textContent='Tidak dapat menyalin';}t.remove();}setTimeout(()=>btn.textContent='Salin CSV',1800);};
}

  document.querySelectorAll('#ctbl th.sortable').forEach(h=>{const go=()=>{const k=h.dataset.k;csort=csort.k==k?{k,d:-csort.d}:{k,d:k=='n'||k=='z'||k=='c'?1:-1};$('#ctbl').innerHTML=contractorTable();wireTable();wireInput();};h.onclick=go;h.onkeydown=e=>{if(e.key=='Enter')go();};});
  const t=CT.find(x=>x.id==ctype);const btn=$('#csv');
  if(btn)csvCopy(btn,[['Nama','Zon / Seksyen','Kod','Sept (MT)','Kumulatif (MT)'],...t.rows().map(r=>[r.n,r.z,r.c,r.w,r.k])]);
}
function wireInput(){const inp=$('#cq');if(inp)inp.oninput=e=>{cq=e.target.value;const pos=e.target.selectionStart;$('#ctbl').innerHTML=contractorTable();wireTable();wireInput();const n=$('#cq');n.focus();n.setSelectionRange(pos,pos);};}

const rendered={};
function show(id){
  if(!S[id])id='ringkasan';
  document.querySelectorAll('main section').forEach(s=>s.hidden=s.id!==id);
  document.querySelectorAll('#tabs a').forEach(a=>a.toggleAttribute('aria-current',a.dataset.t===id)||0);
  document.querySelectorAll('#tabs a').forEach(a=>{if(a.dataset.t===id)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  const el=$('#'+id);
  if(!rendered[id]){el.innerHTML=S[id]();rendered[id]=1;if(id==='kontraktor'){wireContractors();wireInput();}
    if(id==='pelupusan')el.querySelectorAll('[data-go]').forEach(a=>a.addEventListener('click',()=>{ctype=a.dataset.go;rendered.kontraktor=0;}));}
  window.scrollTo({top:0});
}
window.addEventListener('hashchange',()=>show(location.hash.slice(1)));
show(location.hash.slice(1)||'ringkasan');

/* theme toggle */
(function(){const r=document.documentElement;let m=null;try{m=localStorage.getItem('isisa-theme');}catch(e){}if(m)r.dataset.theme=m;
$('#themeBtn').onclick=()=>{const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;const n=dark?'light':'dark';r.dataset.theme=n;try{localStorage.setItem('isisa-theme',n);}catch(e){}};})();
</script>
